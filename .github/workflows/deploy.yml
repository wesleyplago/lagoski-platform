name: deploy

# Aplica a plataforma. Variáveis: AWS_DEPLOY_ROLE_ARN, AWS_REGION, AWS_STATE_BUCKET,
# GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_PROJECT_ID, GCP_REGION, GCP_STATE_BUCKET.
# O primeiro apply (que cria o próprio OIDC/WIF) é feito localmente.
on:
  workflow_dispatch:
    inputs:
      cloud:
        type: choice
        options: [aws, gcp]
        required: true
      environment:
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-${{ inputs.cloud }}-${{ inputs.environment }}

jobs:
  aws:
    if: inputs.cloud == 'aws'
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/aws/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}"
          -backend-config="key=lagoski-platform/aws/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform apply -input=false -auto-approve -var region=${{ vars.AWS_REGION }}

  gcp:
    if: inputs.cloud == 'gcp'
    runs-on: ubuntu-latest
    environment: gcp-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/gcp/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
          -backend-config="prefix=lagoski-platform/gcp/${{ inputs.environment }}"
      - run: >
          terraform apply -input=false -auto-approve
          -var project_id=${{ vars.GCP_PROJECT_ID }}
          -var region=${{ vars.GCP_REGION }}
          -var state_bucket=${{ vars.GCP_STATE_BUCKET }}
